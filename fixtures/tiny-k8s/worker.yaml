apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: queue
          image: redis:7.2
          envFrom:
            - configMapRef:
                name: web-config
        - name: sidecar
          image: busybox:1.36
          env:
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: GREETING
      volumes:
        - name: config
          configMap:
            name: web-config
