<text x="382" y="356" fill="#6b7280" font-size="11" text-anchor="middle">commit index</text>
<text x="20" y="372" fill="#6b7280" font-size="10">Arm: no-refresh — each tool's commit-0 artifact scored against truth at that commit, which is what a reader gets when a sync</text>
<text x="20" y="385" fill="#6b7280" font-size="10">mechanism is absent or silently does not fire. greplost is the only one of the four that can report this state mechanically,</text>
<text x="20" y="398" fill="#6b7280" font-size="10">through `verify`. Omitted (not run here): ua. Measured on corpus hono, tier M (248 files); 100 replayed commits.</text>
