<text x="542" y="586" fill="#C3C2B7" font-size="11" text-anchor="middle">commit index</text>
<text x="32" y="610" fill="#8A8983" font-size="10">Arm: no-refresh, each tool's commit-0 artifact scored against truth at that commit, which is what a reader gets when a sync mechanism is absent or silently does not fire. greplost is the only one of the four that can</text>
<text x="32" y="623" fill="#8A8983" font-size="10">report this state mechanically, through `verify`. Omitted (not run here): ua. Measured on corpus hono, tier M (248 files); 100 replayed commits. The walk is synthetic: each commit appends exactly one resolvable import</text>
<text x="32" y="636" fill="#8A8983" font-size="10">line to one file, so truth moves by exactly one edge per commit, and the walk contains no deletions, no renames and no new files.</text>
