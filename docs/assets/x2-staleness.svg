<svg xmlns="http://www.w3.org/2000/svg" width="720" height="497" viewBox="0 0 720 497" font-family="sans-serif" font-size="12">
<rect x="0" y="0" width="720" height="497" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#111827">Freshness under each tool's own sync mechanism: F1 vs commit</text>
<rect x="20" y="38" width="10" height="10" fill="#1d4ed8"/>
<text x="35" y="47" fill="#6b7280">greplost</text>
<rect x="106" y="38" width="10" height="10" fill="#ea580c"/>
<text x="121" y="47" fill="#6b7280">graphify</text>
<rect x="192" y="38" width="10" height="10" fill="#0f766e"/>
<text x="207" y="47" fill="#6b7280">crg</text>
<line x1="64" y1="322" x2="700" y2="322" stroke="#e5e7eb"/>
<text x="56" y="326" fill="#6b7280" font-size="11" text-anchor="end">0</text>
<line x1="64" y1="256" x2="700" y2="256" stroke="#e5e7eb"/>
<text x="56" y="260" fill="#6b7280" font-size="11" text-anchor="end">0.25</text>
<line x1="64" y1="190" x2="700" y2="190" stroke="#e5e7eb"/>
<text x="56" y="194" fill="#6b7280" font-size="11" text-anchor="end">0.5</text>
<line x1="64" y1="124" x2="700" y2="124" stroke="#e5e7eb"/>
<text x="56" y="128" fill="#6b7280" font-size="11" text-anchor="end">0.75</text>
<line x1="64" y1="58" x2="700" y2="58" stroke="#e5e7eb"/>
<text x="56" y="62" fill="#6b7280" font-size="11" text-anchor="end">1</text>
<line x1="64" y1="58" x2="64" y2="322" stroke="#9ca3af"/>
<line x1="64" y1="322" x2="700" y2="322" stroke="#9ca3af"/>
<text x="18" y="190" fill="#6b7280" font-size="11" text-anchor="middle" transform="rotate(-90 18 190)">F1 vs compiler truth</text>
<text x="382" y="356" fill="#6b7280" font-size="11" text-anchor="middle">commit index</text>
<text x="20" y="372" fill="#6b7280" font-size="10">Arm: documented-sync — each tool's sync mechanism was installed exactly as its README describes and then left alone; the harness</text>
<text x="20" y="385" fill="#6b7280" font-size="10">only commits, except that crg's `visualize --format json` export is run at each scoring checkpoint because nothing else writes the</text>
<text x="20" y="398" fill="#6b7280" font-size="10">JSON its artifact is read from (it is outside every timing and does not rebuild). This is the arm tech spec 10.0 X2 words. Read</text>
<text x="20" y="411" fill="#6b7280" font-size="10">the FALL of each line, not its height: the height is that tool's import coverage (X1's subject) and only the fall is staleness. At</text>
<text x="20" y="424" fill="#6b7280" font-size="10">commit 0 the freshly built artifacts scored greplost 1.000, graphify 0.131, crg 0.894; over the walk their decay (F1 at commit 0</text>
<text x="20" y="437" fill="#6b7280" font-size="10">minus F1 at the last commit) was greplost 0.000, graphify +0.005, crg -0.003, a negative decay being ground gained. The distance</text>
<text x="20" y="450" fill="#6b7280" font-size="10">between the lines is mostly that starting difference, which is coverage and belongs to X1; the staleness X2 measures is the</text>
<text x="20" y="463" fill="#6b7280" font-size="10">movement. Omitted (not run here): ua. Measured on corpus hono, tier M (248 files); 100 replayed commits. The walk is synthetic:</text>
<text x="20" y="476" fill="#6b7280" font-size="10">each commit appends exactly one resolvable import line to one file, so truth moves by exactly one edge per commit, and the walk</text>
<text x="20" y="489" fill="#6b7280" font-size="10">contains no deletions, no renames and no new files.</text>
<polyline points="64,58 140.32,58 216.64,58 292.96,58 369.28,58 445.6,58 521.92,58 598.24,58 674.56,58 700,58" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<polyline points="64,287.55 140.32,287.42 216.64,288.08 292.96,288.68 369.28,289.29 445.6,288.42 521.92,288.29 598.24,288.87 674.56,288.71 700,288.92" fill="none" stroke="#ea580c" stroke-width="2"/>
