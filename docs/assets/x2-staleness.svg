<text x="24" y="321" fill="#C3C2B7" font-size="11" text-anchor="middle" transform="rotate(-90 24 321)">F1 vs compiler truth</text>
<text x="542" y="586" fill="#C3C2B7" font-size="11" text-anchor="middle">commit index</text>
<text x="32" y="610" fill="#8A8983" font-size="10">Arm: documented-sync; each tool's sync mechanism was installed exactly as its README describes and then left alone; the harness only commits, except that crg's `visualize --format json` export is run at each scoring</text>
<text x="32" y="623" fill="#8A8983" font-size="10">checkpoint because nothing else writes the JSON its artifact is read from (it is outside every timing and does not rebuild). This is the arm tech spec 10.0 X2 words. Read the FALL of each line, not its height: the</text>
<text x="32" y="636" fill="#8A8983" font-size="10">height is that tool's import coverage (X1's subject) and only the fall is staleness. At commit 0 the freshly built artifacts scored greplost 1.000, graphify 0.131, crg 0.894; over the walk their decay (F1 at commit 0</text>
<text x="32" y="649" fill="#8A8983" font-size="10">minus F1 at the last commit) was greplost 0.000, graphify +0.005, crg -0.003, a negative decay being ground gained. The distance between the lines is mostly that starting difference, which is coverage and belongs to</text>
<text x="32" y="662" fill="#8A8983" font-size="10">X1; the staleness X2 measures is the movement. Omitted (not run here): ua. Measured on corpus hono, tier M (248 files); 100 replayed commits. The walk is synthetic: each commit appends exactly one resolvable import</text>
<text x="32" y="675" fill="#8A8983" font-size="10">line to one file, so truth moves by exactly one edge per commit, and the walk contains no deletions, no renames and no new files.</text>
