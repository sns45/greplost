<text x="32" y="40" font-size="20" font-weight="600" fill="#FFFFFF">Freshness under each tool's own sync mechanism: F1 vs commit</text>
<text x="1168" y="40" font-size="11" fill="#8A8983" text-anchor="end">greplost bench · bench/RESULTS.md</text>
<text x="32" y="64" font-size="13" fill="#C3C2B7">Arm: documented-sync; corpus hono, tier M (248 files); 100 replayed commits; the walk is synthetic (one added import line per commit). Read the fall of a line, not its height.</text>
