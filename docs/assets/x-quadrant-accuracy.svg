<text x="1168" y="40" font-size="11" fill="#8A8983" text-anchor="end">greplost bench · bench/RESULTS.md</text>
<text x="32" y="64" font-size="13" fill="#C3C2B7">Arm: no-LLM path, every confidence; corpus anyq, tier S (148 files); cold start is the median of the timed runs.</text>
<circle cx="38" cy="90" r="5" fill="#0fa976"/>
<circle cx="38" cy="90" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
