name: ci
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.2.21 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: azure/setup-helm@v4
        with: { version: "v3.16.4" }
      - name: kotlin compiler for the Kotlin fixture oracle
        run: |
          curl -sSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip
          unzip -q /tmp/kotlinc.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      # The Rust oracle (`bench/truth/rusttruth`) is a cargo program, built once
      # into bench/.corpus/.tools and named by the hash of its own sources. The
      # first build on a cold runner needs the network for `cargo fetch`; every
      # build after that is `--offline`, which is what the registry cache below
      # is for. python3 is 3.12 on ubuntu-latest and the Python oracle's floor is
      # 3.11, so it needs no step. kotlinc is deliberately absent: Kotlin ships
      # reported-only (Appendix C 2026-09-04) and its truth tests skip with a
      # printed reason when the toolchain is not on PATH.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the cargo registry for the Rust truth generator
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('bench/truth/rusttruth/Cargo.lock') }}
      - name: Cache the Go module downloads for the Go truth generators
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ hashFiles('bench/truth/*/go.sum') }}
      # The built oracles, keyed by the sources they are named after: a pinned
      # dependency change rebuilds them and nothing else does.
      - name: Cache the built truth generators
        uses: actions/cache@v4
        with:
          path: bench/.corpus/.tools
          key: truth-tools-${{ hashFiles('bench/truth/*/go.mod', 'bench/truth/*/go.sum', 'bench/truth/*/main.go', 'bench/truth/rusttruth/Cargo.lock', 'bench/truth/rusttruth/Cargo.toml', 'bench/truth/rusttruth/src/**', 'bench/truth/javatruth/**', 'bench/truth/pytruth/**', 'bench/truth/kotlintruth/**') }}
      - run: bun install --frozen-lockfile
      - name: go modules for the Go truth generators
        run: |
          set -euo pipefail
          for tool in gocallgraph tfinspect pulumigotruth; do
            (cd "bench/truth/$tool" && go mod download)
          done
      - run: bun run typecheck
      - run: bun test
      - name: build the publishable bundle
        run: bun run build
      # The tests all run the CLI from source under Bun. This is the artifact
      # users actually get: the node bundle, its vendored grammars, and the
      # `bin/` shim npm installs — none of which any test exercises.
      - name: the built binary runs under node
        run: |
          set -euo pipefail
          node packages/cli/bin/greplost.js --version
          smoke="$(mktemp -d)"
          cp -R fixtures/tiny-ts "$smoke/repo"
          node packages/cli/bin/greplost.js init --no-hooks --root "$smoke/repo"
          node packages/cli/bin/greplost.js verify --root "$smoke/repo"
      - name: verify the committed map of this repo
        run: bun packages/cli/src/main.ts verify --diff
      - name: README tables match bench/RESULTS.md
        run: bun run readme:check
      - name: Cache the benchmark corpus (pinned in bench/corpus.json)
        uses: actions/cache@v4
        with:
          path: bench/.corpus
          key: corpus-${{ hashFiles('bench/corpus.json') }}
      - name: "Corpus setup (tier S: every pinned repo, one per language and flavour; tier M)"
        run: bun bench/src/cli.ts corpus setup --tier S && bun bench/src/cli.ts corpus setup --tier M
      # Every language, IaC flavour and signal pass is scored here: the tier-S
      # corpus is the whole build-2 set, and a target whose oracle measures
      # nothing is gated on the three substitute checks instead.
      - name: structural accuracy gate (tier S)
        run: bun run bench:structural --tier S --gate
      - name: map quality gate
        run: bun run bench:mapquality --gate
      - name: freshness gate (100-commit replay)
        run: bun run bench:replay --commits 100 --gate
      - name: performance gate (tier S)
        run: bun run bench:perf --tier S --gate
