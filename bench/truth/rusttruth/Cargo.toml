[package]
name = "rusttruth"
version = "0.1.0"
edition = "2021"
publish = false
description = "Independent Rust structure oracle for the greplost benchmark (syn + cargo metadata)."

[[bin]]
name = "rusttruth"
path = "src/main.rs"

[dependencies]
cargo_metadata = "=0.19.2"
proc-macro2 = "=1.0.105"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
syn = { version = "=2.0.114", features = ["full", "visit", "extra-traits"] }

[profile.release]
debug = false
